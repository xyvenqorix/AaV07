<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Game Boy Web</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#080a0f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    height:60px;
    padding:0 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#10141b;
    border-bottom:1px solid #292e37;
    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    font-size:19px;
    font-weight:800;
}

.subtitle{
    color:#858c97;
    font-size:12px;
}

.container{
    max-width:1250px;
    margin:auto;
    padding:20px 14px 50px;
}

.title{
    margin-bottom:16px;
}

.title h1{
    margin:0;
    font-size:24px;
}

.title p{
    margin:5px 0 0;
    color:#858c97;
    font-size:13px;
}

.search{
    margin-bottom:18px;
}

.search input{
    width:100%;
    padding:12px 15px;
    border-radius:11px;
    border:1px solid #292f38;
    outline:none;
    background:#11151c;
    color:#fff;
    font-size:14px;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
    gap:14px;
}

.game{
    position:relative;
    min-width:0;
    overflow:hidden;
    border:1px solid #292f38;
    border-radius:12px;
    background:#11151c;
    transition:.18s;
}

.game:hover{
    transform:translateY(-3px);
    border-color:#5865f2;
}

.cover{
    width:100%;
    aspect-ratio:1/1.25;
    background:#181c24;
    overflow:hidden;
}

.cover img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.info{
    padding:8px;
}

.game-name{
    margin-bottom:7px;
    text-align:center;
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.play{
    width:100%;
    padding:8px;
    border:0;
    border-radius:8px;
    background:#5865f2;
    color:white;
    font-weight:700;
    font-size:12px;
    cursor:pointer;
}

.favorite{
    position:absolute;
    right:7px;
    top:7px;
    z-index:5;
    width:29px;
    height:29px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.75);
    color:#fff;
    font-size:16px;
}

.favorite.active{
    color:#ffd84d;
}

/* PLAYER */

#playerModal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    flex-direction:column;
    background:#000;
}

.playerHeader{
    height:58px;
    flex-shrink:0;
    padding:0 8px 0 12px;
    display:flex;
    align-items:center;
    gap:6px;
    background:#10141b;
    border-bottom:1px solid #292e37;
}

.playerTitle{
    flex:1;
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:14px;
    font-weight:700;
}

.headerButton{
    flex-shrink:0;
    border:1px solid #353b46;
    border-radius:8px;
    padding:7px 9px;
    background:#20252e;
    color:white;
    font-size:11px;
    cursor:pointer;
}

.headerButton:active{
    transform:scale(.95);
}

.close{
    background:#303640;
}

#player{
    position:relative;
    width:100%;
    height:calc(100vh - 58px);
    overflow:hidden;
    background:#000;
}

/* LOADING */

#loading{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#050608;
    text-align:center;
    padding:20px;
}

.loadingIcon{
    font-size:42px;
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.1)}
}

.loadingTitle{
    margin-top:10px;
    font-size:19px;
    font-weight:800;
}

.loadingText{
    margin-top:6px;
    color:#858c97;
    font-size:12px;
}

.progress{
    width:min(350px,85%);
    height:7px;
    margin-top:20px;
    overflow:hidden;
    border-radius:20px;
    background:#20242c;
}

.progressBar{
    width:0;
    height:100%;
    background:#5865f2;
    transition:width .2s;
}

.percent{
    margin-top:8px;
    color:#999;
    font-size:12px;
}

#error{
    display:none;
    max-width:420px;
    margin-top:15px;
    color:#ff7070;
    font-size:13px;
    line-height:1.5;
}

/* TOAST */

#toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(20px);
    z-index:500;
    opacity:0;
    pointer-events:none;
    padding:10px 14px;
    border-radius:10px;
    background:#171b22;
    border:1px solid #343a45;
    color:white;
    font-size:12px;
    transition:.25s;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* MOBILE */

@media(max-width:600px){

    .container{
        padding:15px 9px 40px;
    }

    .games{
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:9px;
    }

    .game-name{
        font-size:11px;
    }

    .play{
        padding:7px;
        font-size:10px;
    }

    .playerHeader{
        gap:4px;
        padding-left:7px;
        padding-right:5px;
    }

    .playerTitle{
        font-size:12px;
    }

    .headerButton{
        padding:6px 7px;
        font-size:9px;
    }
}

@media(max-width:350px){

    .games{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .headerButton{
        padding:6px 5px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🎮 Game Boy Web</div>
    <div class="subtitle">Biblioteca</div>
</header>

<main class="container">

    <div class="title">
        <h1>🎮 Juegos</h1>
        <p>Toca JUGAR para comenzar</p>
    </div>

    <div class="search">
        <input
            id="search"
            type="search"
            placeholder="🔎 Buscar juego..."
            autocomplete="off">
    </div>

    <div id="games" class="games"></div>

</main>


<!-- =========================
     EMULADOR
========================= -->

<div id="playerModal">

    <div class="playerHeader">

        <div id="playerTitle" class="playerTitle">
            🎮 Juego
        </div>

        <!-- EXPORTAR -->
        <button
            id="exportButton"
            class="headerButton">
            📤 Exportar
        </button>

        <!-- IMPORTAR -->
        <button
            id="importButton"
            class="headerButton">
            📥 Importar
        </button>

        <!-- CERRAR -->
        <button
            id="closePlayer"
            class="headerButton close">
            ✕ Cerrar
        </button>

        <input
            id="importFile"
            type="file"
            accept=".state"
            hidden>

    </div>


    <div id="player">

        <div id="loading">

            <div class="loadingIcon">
                🎮
            </div>

            <div class="loadingTitle">
                Cargando juego
            </div>

            <div
                id="loadingText"
                class="loadingText">
                Preparando Game Boy...
            </div>

            <div class="progress">
                <div
                    id="progressBar"
                    class="progressBar">
                </div>
            </div>

            <div
                id="percent"
                class="percent">
                0%
            </div>

            <div id="error">
                ❌ No se pudo cargar el juego.
                <br><br>
                Comprueba que el archivo
                <b>.gb</b>
                exista en tu repositorio.
            </div>

        </div>

    </div>

</div>


<div id="toast"></div>


<script>

/* =========================================================
   TUS JUEGOS

   index.html
   juego1.gb
   juego2.gb

   Los .gb están junto al index.html.
========================================================= */

const juegos = [

    {
        id:"Poke Red",
        name:"Pokemon Rojo Fuego",
        rom:"Pokemon - Red Version (UE) [S][!].gb",
        cover:"https://i.imgur.com/REEMPLAZA-ESTO.jpg"
    },

    {
        id:"juego2",
        name:"Mi Juego 2",
        rom:"juego2.gb",
        cover:"https://i.imgur.com/REEMPLAZA-ESTO.jpg"
    }

];


/* =========================================================
   ELEMENTOS
========================================================= */

const games =
    document.getElementById("games");

const search =
    document.getElementById("search");

const playerModal =
    document.getElementById("playerModal");

const playerTitle =
    document.getElementById("playerTitle");

const closePlayer =
    document.getElementById("closePlayer");

const exportButton =
    document.getElementById("exportButton");

const importButton =
    document.getElementById("importButton");

const importFile =
    document.getElementById("importFile");

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const progressBar =
    document.getElementById("progressBar");

const percent =
    document.getElementById("percent");

const error =
    document.getElementById("error");

const toast =
    document.getElementById("toast");


/* =========================================================
   VARIABLES
========================================================= */

let juegoActual = null;
let progresoTimer = null;
let autoSaveTimer = null;

let favoritos =
    JSON.parse(
        localStorage.getItem("gb_favoritos") || "[]"
    );


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function mostrarToast(texto){

    toast.textContent = texto;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(
        ()=>{
            toast.classList.remove("show");
        },
        1800
    );
}


/* =========================================================
   FAVORITOS
========================================================= */

function guardarFavoritos(){

    localStorage.setItem(
        "gb_favoritos",
        JSON.stringify(favoritos)
    );
}


/* =========================================================
   LISTA
========================================================= */

function mostrarJuegos(lista=juegos){

    games.innerHTML = "";

    if(!lista.length){

        games.innerHTML = `
            <p style="
                grid-column:1/-1;
                text-align:center;
                color:#858c97;
                padding:30px;">
                No se encontraron juegos.
            </p>
        `;

        return;
    }


    lista.forEach(juego=>{

        const card =
            document.createElement("article");

        card.className = "game";

        const favorito =
            favoritos.includes(juego.id);


        card.innerHTML = `

            <button class="favorite ${
                favorito ? "active" : ""
            }">

                ${favorito ? "★" : "☆"}

            </button>

            <div class="cover">

                <img
                    src="${juego.cover}"
                    alt="${juego.name}"
                    loading="lazy"
                    onerror="
                        this.style.display='none'
                    ">

            </div>

            <div class="info">

                <div class="game-name">
                    ${juego.name}
                </div>

                <button class="play">
                    ▶ JUGAR
                </button>

            </div>
        `;


        const favButton =
            card.querySelector(".favorite");


        favButton.onclick = event=>{

            event.stopPropagation();

            if(
                favoritos.includes(juego.id)
            ){

                favoritos =
                    favoritos.filter(
                        id=>id!==juego.id
                    );

            }else{

                favoritos.push(juego.id);

            }

            guardarFavoritos();

            mostrarJuegos(
                filtrar(search.value)
            );
        };


        /*
           IMPORTANTE:

           La portada NO abre el juego.
           Solo JUGAR lo abre.
        */

        card.querySelector(".play").onclick =
            event=>{

                event.stopPropagation();

                abrirJuego(juego);

            };


        games.appendChild(card);

    });
}


/* =========================================================
   BUSCAR
========================================================= */

function filtrar(texto){

    texto =
        texto
        .toLowerCase()
        .trim();

    if(!texto){
        return juegos;
    }

    return juegos.filter(
        juego=>
            juego.name
            .toLowerCase()
            .includes(texto)
    );
}


search.addEventListener(
    "input",
    ()=>{
        mostrarJuegos(
            filtrar(search.value)
        );
    }
);


/* =========================================================
   CONFIGURAR EMULATORJS
========================================================= */

function configurarEmulador(juego){

    window.EJS_player =
        "#player";

    window.EJS_core =
        "gb";

    window.EJS_gameUrl =
        juego.rom;

    window.EJS_gameName =
        juego.name;

    /*
       MUY IMPORTANTE:

       Cada juego tiene su propio ID.
       De esta forma los estados no
       se mezclan entre juegos.
    */

    window.EJS_gameID =
        "gb_" + juego.id;

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded =
        true;

    window.EJS_controlScheme =
        "gameboy";
}


/* =========================================================
   ABRIR
========================================================= */

function abrirJuego(juego){

    juegoActual = juego;

    playerTitle.textContent =
        "🎮 " + juego.name;

    playerModal.style.display =
        "flex";

    loading.style.display =
        "flex";

    error.style.display =
        "none";

    progressBar.style.width =
        "0%";

    percent.textContent =
        "0%";

    loadingText.textContent =
        "Preparando Game Boy...";


    configurarEmulador(juego);


    let progreso = 0;

    clearInterval(progresoTimer);

    progresoTimer =
        setInterval(()=>{

            if(progreso < 90){

                progreso += 4;

                progressBar.style.width =
                    progreso + "%";

                percent.textContent =
                    progreso + "%";

                if(progreso < 30){

                    loadingText.textContent =
                        "Cargando emulador...";

                }else if(progreso < 60){

                    loadingText.textContent =
                        "Preparando controles...";

                }else{

                    loadingText.textContent =
                        "Cargando juego...";

                }
            }

        },250);


    /*
       Eliminar loader anterior.
    */

    const viejo =
        document.getElementById(
            "emulatorLoader"
        );

    if(viejo){
        viejo.remove();
    }


    /*
       Cargar EmulatorJS.
    */

    const script =
        document.createElement("script");

    script.id =
        "emulatorLoader";

    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";


    script.onload = ()=>{

        setTimeout(()=>{

            clearInterval(progresoTimer);

            progressBar.style.width =
                "100%";

            percent.textContent =
                "100%";

            loadingText.textContent =
                "¡Juego listo!";

            setTimeout(()=>{

                loading.style.display =
                    "none";

                iniciarAutoGuardado();

            },700);

        },1800);

    };


    script.onerror = ()=>{

        clearInterval(progresoTimer);

        loadingText.textContent =
            "Error al cargar EmulatorJS.";

        error.style.display =
            "block";

    };


    document.body.appendChild(script);
}


/* =========================================================
   OBTENER EMULADOR
========================================================= */

function obtenerEmulador(){

    /*
       EmulatorJS expone la instancia
       normalmente como EJS_emulator.

       También comprobamos EJS.
    */

    if(window.EJS_emulator){
        return window.EJS_emulator;
    }

    if(window.EJS){
        return window.EJS;
    }

    return null;
}


/* =========================================================
   GUARDAR ESTADO
========================================================= */

async function guardarEstado(){

    const emulador =
        obtenerEmulador();

    if(
        !emulador ||
        typeof emulador.saveState !== "function"
    ){

        mostrarToast(
            "El emulador todavía no está listo."
        );

        return null;
    }


    try{

        /*
           ESTE ES EL SAVE STATE REAL.

           No reinicia la ROM.
           Guarda exactamente el momento
           actual de la emulación.
        */

        const estado =
            await emulador.saveState();

        mostrarToast(
            "💾 Estado guardado"
        );

        return estado;

    }catch(e){

        console.error(e);

        mostrarToast(
            "❌ No se pudo guardar"
        );

        return null;
    }
}


/* =========================================================
   CARGAR ESTADO
========================================================= */

async function cargarEstado(estado=null){

    const emulador =
        obtenerEmulador();

    if(
        !emulador ||
        typeof emulador.loadState !== "function"
    ){

        mostrarToast(
            "El emulador todavía no está listo."
        );

        return false;
    }


    try{

        /*
           Si no pasamos archivo, EmulatorJS
           carga el Save State que ya tiene
           guardado en el navegador.

           Si pasamos un estado importado,
           se intenta cargar directamente
           sobre el juego que está abierto.
        */

        if(estado !== null){

            await emulador.loadState(
                estado
            );

        }else{

            await emulador.loadState();

        }


        mostrarToast(
            "📂 Estado cargado"
        );

        return true;

    }catch(e){

        console.error(e);

        mostrarToast(
            "❌ Estado incompatible o inválido"
        );

        return false;
    }
}


/* =========================================================
   EXPORTAR
========================================================= */

async function exportarEstado(){

    if(!juegoActual){

        mostrarToast(
            "No hay ningún juego abierto."
        );

        return;
    }


    /*
       Primero guardamos el estado actual
       y obtenemos exactamente ese estado.
    */

    const estado =
        await guardarEstado();


    if(!estado){
        return;
    }


    try{

        let datos;


        /*
           Convertir el estado a bytes.

           EmulatorJS puede devolver diferentes
           representaciones según la versión.
        */

        if(
            estado instanceof Uint8Array
        ){

            datos = estado;

        }else if(
            estado instanceof ArrayBuffer
        ){

            datos =
                new Uint8Array(estado);

        }else if(
            ArrayBuffer.isView(estado)
        ){

            datos =
                new Uint8Array(
                    estado.buffer,
                    estado.byteOffset,
                    estado.byteLength
                );

        }else{

            /*
               Si devuelve una estructura
               serializable.
            */

            const texto =
                JSON.stringify(estado);

            datos =
                new TextEncoder()
                .encode(texto);
        }


        const blob =
            new Blob(
                [datos],
                {
                    type:
                    "application/octet-stream"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const enlace =
            document.createElement("a");


        enlace.href = url;

        enlace.download =
            juegoActual.id +
            "-save.state";


        document.body.appendChild(
            enlace
        );

        enlace.click();

        enlace.remove();


        setTimeout(
            ()=>{
                URL.revokeObjectURL(url);
            },
            1000
        );


        mostrarToast(
            "📤 Partida exportada"
        );

    }catch(e){

        console.error(e);

        mostrarToast(
            "❌ No se pudo exportar"
        );
    }
}


/* =========================================================
   IMPORTAR
========================================================= */

importButton.onclick =
    ()=>{

        /*
           El juego debe estar abierto.
           NO salimos del emulador.
        */

        importFile.click();
    };


importFile.addEventListener(
    "change",
    async function(){

        const archivo =
            this.files[0];

        if(!archivo){
            return;
        }


        try{

            const datos =
                await archivo.arrayBuffer();


            /*
               Intentamos entregar los bytes
               directamente a loadState().
            */

            const estado =
                new Uint8Array(datos);


            await cargarEstado(estado);


        }catch(e){

            console.error(e);

            mostrarToast(
                "❌ No se pudo importar"
            );
        }


        /*
           Permite volver a elegir
           el mismo archivo posteriormente.
        */

        this.value = "";
    }
);


/* =========================================================
   AUTO SAVE
========================================================= */

function iniciarAutoGuardado(){

    clearInterval(autoSaveTimer);


    /*
       Cada 60 segundos guarda un Save State
       dentro del almacenamiento de EmulatorJS.

       Esto NO exporta un archivo.
       El archivo solo se crea cuando pulsas
       Exportar.
    */

    autoSaveTimer =
        setInterval(
            ()=>{

                const emulador =
                    obtenerEmulador();

                if(
                    emulador &&
                    typeof
                    emulador.saveState ===
                    "function"
                ){

                    try{

                        emulador.saveState();

                        console.log(
                            "💾 Auto-guardado"
                        );

                    }catch(e){

                        console.log(
                            "Auto-save no disponible"
                        );
                    }
                }

            },
            60000
        );
}


/* =========================================================
   CERRAR
========================================================= */

closePlayer.onclick =
    async ()=>{

        /*
           Antes de salir intentamos guardar
           el estado actual.
        */

        const emulador =
            obtenerEmulador();


        if(
            emulador &&
            typeof
            emulador.saveState ===
            "function"
        ){

            try{

                await emulador.saveState();

            }catch(e){

                console.log(
                    "No se pudo guardar al cerrar."
                );
            }
        }


        clearInterval(
            autoSaveTimer
        );

        clearInterval(
            progresoTimer
        );


        playerModal.style.display =
            "none";


        /*
           Limpiamos el emulador
           sin recargar toda la página.
        */

        const loader =
            document.getElementById(
                "emulatorLoader"
            );

        if(loader){
            loader.remove();
        }


        juegoActual = null;
    };


/* =========================================================
   INICIO
========================================================= */

mostrarJuegos();

</script>

</body>
</html>
