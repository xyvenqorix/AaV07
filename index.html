<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Boy Web</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #080a0f;
    color: white;
    font-family: Arial, sans-serif;
}

/* CABECERA */

header {
    height: 60px;
    padding: 0 18px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #10141b;
    border-bottom: 1px solid #272c35;

    position: sticky;
    top: 0;
    z-index: 50;
}

.logo {
    font-size: 20px;
    font-weight: 800;
}

.subtitle {
    color: #777f8b;
    font-size: 12px;
}


/* CONTENEDOR */

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px 14px 50px;
}

.title {
    margin-bottom: 15px;
}

.title h1 {
    margin: 0;
    font-size: 24px;
}

.title p {
    margin: 5px 0 0;
    color: #7f8792;
    font-size: 13px;
}


/* BUSCADOR */

.search {
    margin-bottom: 18px;
}

.search input {
    width: 100%;
    padding: 12px 15px;

    border-radius: 11px;
    border: 1px solid #292f38;

    outline: none;

    background: #11151c;
    color: white;

    font-size: 14px;
}


/* ==========================
   CUADRÍCULA
========================== */

.games {
    display: grid;

    /*
       TARJETAS PEQUEÑAS
    */

    grid-template-columns:
        repeat(auto-fill, minmax(145px, 1fr));

    gap: 14px;
}


/* ==========================
   TARJETA
========================== */

.game {
    min-width: 0;

    background: #11151c;

    border: 1px solid #292f38;
    border-radius: 12px;

    overflow: hidden;

    transition: .18s ease;
}

.game:hover {
    border-color: #5865f2;
    transform: translateY(-3px);
}


/* ==========================
   PORTADA
========================== */

.cover {
    width: 100%;

    /*
       MÁS PEQUEÑA
    */

    aspect-ratio: 1 / 1.25;

    background: #181c24;

    overflow: hidden;
}

.cover img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* ==========================
   INFORMACIÓN
========================== */

.info {
    padding: 9px;
}


/* NOMBRE DEBAJO */

.game-name {
    font-size: 14px;
    font-weight: 700;

    text-align: center;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    margin-bottom: 7px;
}


/* ==========================
   BOTÓN JUGAR
========================== */

.play {
    width: 100%;

    padding: 8px;

    border: 0;
    border-radius: 8px;

    background: #5865f2;
    color: white;

    font-size: 12px;
    font-weight: 700;

    cursor: pointer;
}

.play:active {
    transform: scale(.96);
}


/* ==========================
   FAVORITO
========================== */

.favorite {
    position: absolute;

    top: 7px;
    right: 7px;

    width: 30px;
    height: 30px;

    border: 0;
    border-radius: 50%;

    background: rgba(0,0,0,.7);

    color: white;

    cursor: pointer;

    z-index: 5;
}

.favorite.active {
    color: #ffd84d;
}


/*
   Necesario para posicionar
   el favorito
*/

.game {
    position: relative;
}


/* ==========================
   EMULADOR
========================== */

#playerModal {
    position: fixed;
    inset: 0;

    background: #000;

    z-index: 100;

    display: none;
    flex-direction: column;
}

.playerHeader {
    height: 56px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 12px;

    background: #10141b;

    border-bottom: 1px solid #272c35;
}

.playerTitle {
    font-size: 14px;
    font-weight: 700;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.close {
    border: 0;

    background: #252a33;

    color: white;

    border-radius: 8px;

    padding: 8px 12px;

    cursor: pointer;
}

#player {
    position: relative;

    width: 100%;
    height: calc(100vh - 56px);

    background: #000;

    overflow: hidden;
}


/* ==========================
   PANTALLA DE CARGA
========================== */

#loading {
    position: absolute;

    inset: 0;

    z-index: 20;

    background: #050608;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;
}

.loading-icon {
    font-size: 42px;

    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(1.1);
    }
}

.loading-title {
    margin-top: 10px;

    font-size: 19px;
    font-weight: 800;
}

.loading-text {
    margin-top: 6px;

    color: #858b96;

    font-size: 12px;
}


/* BARRA */

.progress {
    width: min(350px, 85%);

    height: 7px;

    margin-top: 20px;

    background: #20242c;

    border-radius: 20px;

    overflow: hidden;
}

.progress-bar {
    height: 100%;

    width: 0%;

    background: #5865f2;

    transition: width .25s;
}

.percent {
    margin-top: 8px;

    color: #999;

    font-size: 12px;
}


/* ERROR */

#error {
    display: none;

    color: #ff7070;

    margin-top: 15px;

    max-width: 400px;

    font-size: 13px;
}


/* ==========================
   ANDROID
========================== */

@media (max-width: 600px) {

    .container {
        padding: 15px 9px;
    }

    /*
       3 JUEGOS POR FILA
    */

    .games {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));

        gap: 9px;
    }

    .info {
        padding: 7px;
    }

    .game-name {
        font-size: 12px;
    }

    .play {
        font-size: 11px;
        padding: 7px;
    }

    .favorite {
        width: 27px;
        height: 27px;

        font-size: 14px;
    }

}


/* TELÉFONOS MUY PEQUEÑOS */

@media (max-width: 350px) {

    .games {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

}
</style>
</head>


<body>


<header>

    <div class="logo">
        🎮 Game Boy Web
    </div>

    <div class="subtitle">
        Biblioteca
    </div>

</header>


<main class="container">

    <div class="title">

        <h1>🎮 Juegos</h1>

        <p>
            Selecciona un juego y pulsa JUGAR
        </p>

    </div>


    <div class="search">

        <input
            id="search"
            type="search"
            placeholder="🔎 Buscar juego..."
        >

    </div>


    <div
        id="games"
        class="games">
    </div>

</main>


<!-- ==========================
     EMULADOR
========================== -->

<div id="playerModal">

    <div class="playerHeader">

        <div
            id="playerTitle"
            class="playerTitle">
        </div>

        <button
            id="closePlayer"
            class="close">
            ✕ Cerrar
        </button>

    </div>


    <div id="player">

        <div id="loading">

            <div class="loading-icon">
                🎮
            </div>

            <div class="loading-title">
                Cargando juego
            </div>

            <div
                id="loadingText"
                class="loading-text">

                Preparando Game Boy...

            </div>


            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar">
                </div>

            </div>


            <div
                id="percent"
                class="percent">
                0%
            </div>


            <div id="error">

                ❌ No se pudo cargar el juego.

                <br><br>

                Comprueba que el archivo
                <b>.gb</b>
                esté en el repositorio.

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   JUEGOS
========================================================= */

const juegos = [

    {
        id: "juego1",

        name: "Mi Juego 1",

        rom: "juego1.gb",

        cover:
        "https://i.imgur.com/REEMPLAZA-ESTO.jpg"
    },


    {
        id: "juego2",

        name: "Mi Juego 2",

        rom: "juego2.gb",

        cover:
        "https://i.imgur.com/REEMPLAZA-ESTO.jpg"
    }

];


/* ELEMENTOS */

const gamesContainer =
    document.getElementById("games");

const search =
    document.getElementById("search");

const playerModal =
    document.getElementById("playerModal");

const playerTitle =
    document.getElementById("playerTitle");

const closePlayer =
    document.getElementById("closePlayer");

const loading =
    document.getElementById("loading");

const progressBar =
    document.getElementById("progressBar");

const percent =
    document.getElementById("percent");

const loadingText =
    document.getElementById("loadingText");

const errorBox =
    document.getElementById("error");


/* FAVORITOS */

let favoritos =
    JSON.parse(
        localStorage.getItem("gb_favoritos") || "[]"
    );


function guardarFavoritos() {

    localStorage.setItem(
        "gb_favoritos",
        JSON.stringify(favoritos)
    );

}


/* =========================================================
   MOSTRAR JUEGOS
========================================================= */

function mostrarJuegos(lista = juegos) {

    gamesContainer.innerHTML = "";


    lista.forEach(juego => {

        const card =
            document.createElement("article");

        card.className = "game";


        const favorito =
            favoritos.includes(juego.id);


        card.innerHTML = `

            <button
                class="favorite ${favorito ? "active" : ""}">

                ${favorito ? "★" : "☆"}

            </button>


            <div class="cover">

                <img
                    src="${juego.cover}"
                    alt="${juego.name}"
                    loading="lazy"
                    onerror="
                        this.style.display='none';
                    "
                >

            </div>


            <div class="info">

                <div class="game-name">
                    ${juego.name}
                </div>


                <button
                    class="play">

                    ▶ JUGAR

                </button>

            </div>

        `;


        /* =================================================
           FAVORITO
           NO ABRE EL JUEGO
        ================================================= */

        const favorite =
            card.querySelector(".favorite");


        favorite.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                if (
                    favoritos.includes(juego.id)
                ) {

                    favoritos =
                        favoritos.filter(
                            id => id !== juego.id
                        );

                } else {

                    favoritos.push(
                        juego.id
                    );

                }


                guardarFavoritos();

                mostrarJuegos(
                    filtrar(search.value)
                );

            }
        );


        /* =================================================
           IMPORTANTE:

           LA FOTO NO HACE NADA.

           SOLO EL BOTÓN JUGAR ABRE EL EMULADOR.
        ================================================= */

        const play =
            card.querySelector(".play");


        play.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                abrirJuego(juego);

            }
        );


        gamesContainer.appendChild(card);

    });

}


/* =========================================================
   BUSCADOR
========================================================= */

function filtrar(texto) {

    texto =
        texto
        .toLowerCase()
        .trim();


    if (!texto) {
        return juegos;
    }


    return juegos.filter(
        juego =>
            juego.name
            .toLowerCase()
            .includes(texto)
    );

}


search.addEventListener(
    "input",
    function() {

        mostrarJuegos(
            filtrar(search.value)
        );

    }
);


/* =========================================================
   ABRIR JUEGO
========================================================= */

function abrirJuego(juego) {

    playerModal.style.display =
        "flex";


    playerTitle.textContent =
        "🎮 " + juego.name;


    loading.style.display =
        "flex";


    errorBox.style.display =
        "none";


    progressBar.style.width =
        "0%";


    percent.textContent =
        "0%";


    loadingText.textContent =
        "Preparando Game Boy...";


    /*
       CONFIGURACIÓN
    */

    window.EJS_player =
        "#player";

    window.EJS_core =
        "gb";

    window.EJS_gameUrl =
        juego.rom;

    window.EJS_gameName =
        juego.name;

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded =
        true;

    window.EJS_controlScheme =
        "gameboy";


    /* PROGRESO VISUAL */

    let progreso = 0;


    const intervalo =
        setInterval(
            function() {

                if (progreso < 90) {

                    progreso += 5;

                    if (progreso > 90) {
                        progreso = 90;
                    }


                    progressBar.style.width =
                        progreso + "%";


                    percent.textContent =
                        progreso + "%";


                    if (progreso < 35) {

                        loadingText.textContent =
                            "Cargando emulador...";

                    } else if (progreso < 70) {

                        loadingText.textContent =
                            "Preparando controles...";

                    } else {

                        loadingText.textContent =
                            "Cargando juego...";

                    }

                }

            },
            250
        );


    /* CARGAR EMULATORJS */

    const anterior =
        document.getElementById(
            "emulatorLoader"
        );


    if (anterior) {
        anterior.remove();
    }


    const script =
        document.createElement("script");


    script.id =
        "emulatorLoader";


    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";


    script.onload =
        function() {

            setTimeout(
                function() {

                    clearInterval(
                        intervalo
                    );


                    progressBar.style.width =
                        "100%";


                    percent.textContent =
                        "100%";


                    loadingText.textContent =
                        "¡Juego listo!";


                    /*
                       Ocultar pantalla de carga
                       después de que EmulatorJS
                       haya tenido tiempo de crear
                       su interfaz.
                    */

                    setTimeout(
                        function() {

                            loading.style.display =
                                "none";

                        },
                        800
                    );

                },
                1500
            );

        };


    script.onerror =
        function() {

            clearInterval(
                intervalo
            );


            loadingText.textContent =
                "Error al cargar el emulador.";


            errorBox.style.display =
                "block";

        };


    document.body.appendChild(
        script
    );

}


/* =========================================================
   CERRAR
========================================================= */

closePlayer.addEventListener(
    "click",
    function() {

        location.reload();

    }
);


/* =========================================================
   INICIO
========================================================= */

mostrarJuegos();

</script>

</body>
</html>
