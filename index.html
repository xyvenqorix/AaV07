<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Boy Web</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    background: #080a0f;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}

/* =========================
   CABECERA
========================= */

header {
    height: 60px;
    padding: 0 18px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #10141b;
    border-bottom: 1px solid #272c35;

    position: sticky;
    top: 0;
    z-index: 50;
}

.logo {
    font-size: 20px;
    font-weight: 800;
}

.subtitle {
    color: #7f8792;
    font-size: 12px;
}


/* =========================
   CONTENEDOR
========================= */

.container {
    max-width: 1250px;
    margin: auto;
    padding: 20px 14px 50px;
}

.title {
    margin-bottom: 15px;
}

.title h1 {
    margin: 0;
    font-size: 24px;
}

.title p {
    margin: 5px 0 0;
    color: #7f8792;
    font-size: 13px;
}


/* =========================
   BUSCADOR
========================= */

.search {
    margin-bottom: 18px;
}

.search input {
    width: 100%;
    padding: 12px 15px;

    border-radius: 11px;
    border: 1px solid #292f38;

    outline: none;

    background: #11151c;
    color: white;

    font-size: 14px;
}

.search input:focus {
    border-color: #5865f2;
}


/* =========================
   JUEGOS
========================= */

.games {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(145px, 1fr));

    gap: 14px;
}


/* =========================
   TARJETA
========================= */

.game {
    position: relative;

    min-width: 0;

    background: #11151c;

    border: 1px solid #292f38;

    border-radius: 12px;

    overflow: hidden;

    transition: transform .18s ease,
                border-color .18s ease;
}

.game:hover {
    transform: translateY(-3px);
    border-color: #5865f2;
}


/* =========================
   PORTADA
========================= */

.cover {
    width: 100%;

    aspect-ratio: 1 / 1.25;

    background: #181c24;

    overflow: hidden;
}

.cover img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}


/* =========================
   INFORMACIÓN
========================= */

.info {
    padding: 9px;
}

.game-name {
    font-size: 14px;
    font-weight: 700;

    text-align: center;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    margin-bottom: 7px;
}


/* =========================
   BOTÓN JUGAR
========================= */

.play {
    width: 100%;

    padding: 8px;

    border: 0;
    border-radius: 8px;

    background: #5865f2;
    color: white;

    font-size: 12px;
    font-weight: 700;

    cursor: pointer;
}

.play:active {
    transform: scale(.96);
}


/* =========================
   FAVORITO
========================= */

.favorite {
    position: absolute;

    top: 7px;
    right: 7px;

    width: 30px;
    height: 30px;

    border: 0;
    border-radius: 50%;

    background: rgba(0,0,0,.72);

    color: white;

    font-size: 17px;

    cursor: pointer;

    z-index: 5;
}

.favorite.active {
    color: #ffd84d;
}


/* =========================
   EMULADOR
========================= */

#playerModal {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: none;
    flex-direction: column;

    background: #000;
}

.playerHeader {
    height: 56px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 12px;

    background: #10141b;

    border-bottom: 1px solid #272c35;
}

.playerTitle {
    max-width: 65%;

    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;

    font-size: 14px;
    font-weight: 700;
}

.close {
    border: 0;

    background: #252a33;
    color: white;

    border-radius: 8px;

    padding: 8px 12px;

    cursor: pointer;
}

#player {
    position: relative;

    width: 100%;
    height: calc(100vh - 56px);

    background: #000;

    overflow: hidden;
}


/* =========================
   CARGANDO
========================= */

#loading {
    position: absolute;
    inset: 0;

    z-index: 20;

    background: #050608;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    padding: 20px;
}

.loading-icon {
    font-size: 42px;

    animation: pulse 1.2s infinite ease-in-out;
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.1);
    }
}

.loading-title {
    margin-top: 10px;

    font-size: 19px;
    font-weight: 800;
}

.loading-text {
    margin-top: 6px;

    color: #858b96;

    font-size: 12px;
}


/* =========================
   PROGRESO
========================= */

.progress {
    width: min(350px, 85%);

    height: 7px;

    margin-top: 20px;

    background: #20242c;

    border-radius: 20px;

    overflow: hidden;
}

.progress-bar {
    height: 100%;

    width: 0%;

    background: #5865f2;

    transition: width .25s ease;
}

.percent {
    margin-top: 8px;

    color: #999;

    font-size: 12px;
}


/* =========================
   BOTONES DE GUARDADO
========================= */

.saveTools {
    position: absolute;

    left: 10px;
    top: 10px;

    z-index: 30;

    display: flex;
    gap: 7px;

    opacity: .92;
}

.saveTools button {
    border: 1px solid #343a46;

    background: rgba(15,18,24,.92);

    color: white;

    border-radius: 8px;

    padding: 7px 9px;

    font-size: 11px;

    cursor: pointer;
}

.saveTools button:active {
    transform: scale(.95);
}


/* =========================
   ERROR
========================= */

#error {
    display: none;

    max-width: 420px;

    margin-top: 15px;

    color: #ff7070;

    font-size: 13px;

    line-height: 1.5;
}


/* =========================
   ANDROID
========================= */

@media (max-width: 600px) {

    .container {
        padding: 15px 9px 40px;
    }

    .games {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));

        gap: 9px;
    }

    .info {
        padding: 7px;
    }

    .game-name {
        font-size: 12px;
    }

    .play {
        padding: 7px;
        font-size: 11px;
    }

    .favorite {
        width: 27px;
        height: 27px;
        font-size: 14px;
    }

    .saveTools {
        left: 5px;
        top: 5px;

        gap: 4px;
    }

    .saveTools button {
        padding: 6px 7px;
        font-size: 10px;
    }
}


/* TELÉFONOS MUY PEQUEÑOS */

@media (max-width: 350px) {

    .games {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }
}
</style>
</head>


<body>


<header>

    <div class="logo">
        🎮 Game Boy Web
    </div>

    <div class="subtitle">
        Biblioteca
    </div>

</header>


<main class="container">

    <div class="title">

        <h1>🎮 Juegos</h1>

        <p>
            Toca JUGAR para comenzar
        </p>

    </div>


    <div class="search">

        <input
            id="search"
            type="search"
            placeholder="🔎 Buscar juego..."
            autocomplete="off"
        >

    </div>


    <div
        id="games"
        class="games">
    </div>

</main>


<!-- =========================
     REPRODUCTOR
========================= -->

<div id="playerModal">

    <div class="playerHeader">

        <div
            id="playerTitle"
            class="playerTitle">
        </div>

        <button
            id="closePlayer"
            class="close">

            ✕ Cerrar

        </button>

    </div>


    <div id="player">


        <!-- BOTONES DE GUARDADO -->

        <div
            id="saveTools"
            class="saveTools">

            <button id="saveButton">
                💾 Guardar
            </button>

            <button id="loadButton">
                📂 Cargar
            </button>

        </div>


        <!-- PANTALLA DE CARGA -->

        <div id="loading">

            <div class="loading-icon">
                🎮
            </div>

            <div class="loading-title">
                Cargando juego
            </div>

            <div
                id="loadingText"
                class="loading-text">

                Preparando Game Boy...

            </div>


            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar">
                </div>

            </div>


            <div
                id="percent"
                class="percent">

                0%

            </div>


            <div id="error">

                ❌ No se pudo cargar el juego.

                <br><br>

                Comprueba que el archivo
                <b>.gb</b>
                exista en tu repositorio.

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   TUS JUEGOS
   =========================================================

   Tus archivos deben estar junto a index.html:

       index.html
       juego1.gb
       juego2.gb

   Para cambiar las portadas solo cambia
   la URL de "cover".
========================================================= */


const juegos = [

    {
        id: "Pokemon",

        name: "Pokemon Rojo",

        rom: "Pokemon - Red Version (UE) [S][!].gb",

        cover:
        "https://i.imgur.com/REEMPLAZA-ESTO.jpg"
    },


    {
        id: "juego2",

        name: "Mi Juego 2",

        rom: "juego2.gb",

        cover:
        "https://i.imgur.com/REEMPLAZA-ESTO.jpg"
    }

];


/* =========================================================
   ELEMENTOS
========================================================= */

const gamesContainer =
    document.getElementById("games");

const search =
    document.getElementById("search");

const playerModal =
    document.getElementById("playerModal");

const playerTitle =
    document.getElementById("playerTitle");

const closePlayer =
    document.getElementById("closePlayer");

const loading =
    document.getElementById("loading");

const progressBar =
    document.getElementById("progressBar");

const percent =
    document.getElementById("percent");

const loadingText =
    document.getElementById("loadingText");

const errorBox =
    document.getElementById("error");

const saveButton =
    document.getElementById("saveButton");

const loadButton =
    document.getElementById("loadButton");


/* =========================================================
   FAVORITOS
========================================================= */

let favoritos =
    JSON.parse(
        localStorage.getItem("gb_favoritos") || "[]"
    );


function guardarFavoritos() {

    localStorage.setItem(
        "gb_favoritos",
        JSON.stringify(favoritos)
    );

}


/* =========================================================
   JUEGO ACTUAL
========================================================= */

let juegoActual = null;

let progresoInterval = null;

let autoSaveInterval = null;


/* =========================================================
   MOSTRAR JUEGOS
========================================================= */

function mostrarJuegos(lista = juegos) {

    gamesContainer.innerHTML = "";


    if (lista.length === 0) {

        gamesContainer.innerHTML = `
            <p style="
                color:#858b96;
                grid-column:1/-1;
                text-align:center;
                padding:30px;
            ">
                No se encontraron juegos.
            </p>
        `;

        return;
    }


    lista.forEach(juego => {

        const card =
            document.createElement("article");

        card.className = "game";


        const esFavorito =
            favoritos.includes(juego.id);


        card.innerHTML = `

            <button
                class="favorite ${esFavorito ? "active" : ""}"
                aria-label="Favorito">

                ${esFavorito ? "★" : "☆"}

            </button>


            <div class="cover">

                <img
                    src="${juego.cover}"
                    alt="${juego.name}"
                    loading="lazy"
                    onerror="
                        this.style.display='none';
                    "
                >

            </div>


            <div class="info">

                <div class="game-name">
                    ${juego.name}
                </div>


                <button
                    class="play">

                    ▶ JUGAR

                </button>

            </div>

        `;


        /*
           FAVORITO

           No abre el juego.
        */

        const favorite =
            card.querySelector(".favorite");


        favorite.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                if (
                    favoritos.includes(juego.id)
                ) {

                    favoritos =
                        favoritos.filter(
                            id => id !== juego.id
                        );

                } else {

                    favoritos.push(
                        juego.id
                    );

                }


                guardarFavoritos();

                mostrarJuegos(
                    filtrar(search.value)
                );

            }
        );


        /*
           IMPORTANTE:

           SOLO EL BOTÓN JUGAR
           ABRE EL EMULADOR.
        */

        const play =
            card.querySelector(".play");


        play.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                abrirJuego(juego);

            }
        );


        gamesContainer.appendChild(card);

    });

}


/* =========================================================
   BUSCAR
========================================================= */

function filtrar(texto) {

    texto =
        texto
        .toLowerCase()
        .trim();


    if (!texto) {
        return juegos;
    }


    return juegos.filter(
        juego =>
            juego.name
            .toLowerCase()
            .includes(texto)
    );

}


search.addEventListener(
    "input",
    function() {

        mostrarJuegos(
            filtrar(search.value)
        );

    }
);


/* =========================================================
   CONFIGURACIÓN DEL EMULADOR
========================================================= */

function configurarEmulador(juego) {

    window.EJS_player =
        "#player";

    window.EJS_core =
        "gb";

    window.EJS_gameUrl =
        juego.rom;

    window.EJS_gameName =
        juego.name;


    /*
       ID ÚNICO.

       Esto ayuda a que cada juego
       tenga sus propios datos.
    */

    window.EJS_gameID =
        "gameboy_" + juego.id;


    /*
       EmulatorJS.
    */

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";


    window.EJS_startOnLoaded =
        true;


    window.EJS_controlScheme =
        "gameboy";


    /*
       Mostrar botones del emulador.
    */

    window.EJS_defaultOptions = {

        "save-state-location":
            "browser"

    };

}


/* =========================================================
   ABRIR JUEGO
========================================================= */

function abrirJuego(juego) {

    juegoActual = juego;


    playerModal.style.display =
        "flex";


    playerTitle.textContent =
        "🎮 " + juego.name;


    loading.style.display =
        "flex";


    errorBox.style.display =
        "none";


    progressBar.style.width =
        "0%";


    percent.textContent =
        "0%";


    loadingText.textContent =
        "Preparando Game Boy...";


    configurarEmulador(juego);


    /*
       Progreso visual de preparación.
    */

    let progreso = 0;


    if (progresoInterval) {

        clearInterval(
            progresoInterval
        );

    }


    progresoInterval =
        setInterval(
            function() {

                if (progreso < 90) {

                    progreso += 5;


                    if (progreso > 90) {
                        progreso = 90;
                    }


                    progressBar.style.width =
                        progreso + "%";


                    percent.textContent =
                        progreso + "%";


                    if (progreso < 30) {

                        loadingText.textContent =
                            "Cargando emulador...";

                    } else if (progreso < 60) {

                        loadingText.textContent =
                            "Preparando controles...";

                    } else {

                        loadingText.textContent =
                            "Cargando juego...";

                    }

                }

            },
            250
        );


    /*
       Cargar EmulatorJS.
    */

    const anterior =
        document.getElementById(
            "emulatorLoader"
        );


    if (anterior) {
        anterior.remove();
    }


    const script =
        document.createElement("script");


    script.id =
        "emulatorLoader";


    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";


    script.onload =
        function() {

            /*
               Damos tiempo para que
               aparezca el emulador
               y sus controles.
            */

            setTimeout(
                function() {

                    if (progresoInterval) {

                        clearInterval(
                            progresoInterval
                        );

                    }


                    progressBar.style.width =
                        "100%";


                    percent.textContent =
                        "100%";


                    loadingText.textContent =
                        "¡Juego listo!";


                    /*
                       Ocultamos solamente
                       la pantalla de carga.
                    */

                    setTimeout(
                        function() {

                            loading.style.display =
                                "none";

                        },
                        700
                    );


                    /*
                       Guardado automático.

                       Cada 60 segundos intentamos
                       crear un estado rápido.
                    */

                    iniciarAutoGuardado();

                },
                1600
            );

        };


    script.onerror =
        function() {

            if (progresoInterval) {

                clearInterval(
                    progresoInterval
                );

            }


            loadingText.textContent =
                "No se pudo cargar el emulador.";


            errorBox.style.display =
                "block";

        };


    document.body.appendChild(
        script
    );

}


/* =========================================================
   GUARDADO AUTOMÁTICO
========================================================= */

function iniciarAutoGuardado() {

    if (autoSaveInterval) {

        clearInterval(
            autoSaveInterval
        );

    }


    /*
       Cada 60 segundos dejamos preparado
       el guardado del estado.

       EmulatorJS administra el almacenamiento
       del estado en el navegador.
    */

    autoSaveInterval =
        setInterval(
            function() {

                intentarGuardarEstado();

            },
            60000
        );

}


/* =========================================================
   GUARDAR ESTADO
========================================================= */

function intentarGuardarEstado() {

    try {

        /*
           EmulatorJS expone la instancia
           del emulador a través de EJS_emulator.

           Si todavía no está disponible,
           simplemente no hacemos nada.
        */

        if (
            window.EJS_emulator &&
            typeof
            window.EJS_emulator.saveState
            === "function"
        ) {

            window.EJS_emulator.saveState();

            console.log(
                "💾 Estado guardado automáticamente."
            );

        }

    } catch (error) {

        console.log(
            "No se pudo guardar automáticamente.",
            error
        );

    }

}


/* =========================================================
   BOTÓN GUARDAR
========================================================= */

saveButton.addEventListener(
    "click",
    function() {

        intentarGuardarEstado();


        /*
           Pequeña confirmación visual.
        */

        const texto =
            saveButton.textContent;


        saveButton.textContent =
            "✅ Guardado";


        setTimeout(
            function() {

                saveButton.textContent =
                    texto;

            },
            1200
        );

    }
);


/* =========================================================
   BOTÓN CARGAR
========================================================= */

loadButton.addEventListener(
    "click",
    function() {

        try {

            if (
                window.EJS_emulator &&
                typeof
                window.EJS_emulator.loadState
                === "function"
            ) {

                window.EJS_emulator.loadState();


                const texto =
                    loadButton.textContent;


                loadButton.textContent =
                    "✅ Cargado";


                setTimeout(
                    function() {

                        loadButton.textContent =
                            texto;

                    },
                    1200
                );

            } else {

                alert(
                    "El emulador todavía no está listo."
                );

            }

        } catch (error) {

            console.error(
                "Error cargando estado:",
                error
            );

            alert(
                "No hay un estado guardado disponible."
            );

        }

    }
);


/* =========================================================
   CERRAR
========================================================= */

closePlayer.addEventListener(
    "click",
    function() {

        /*
           Intentamos guardar antes de salir.
        */

        intentarGuardarEstado();


        if (autoSaveInterval) {

            clearInterval(
                autoSaveInterval
            );

            autoSaveInterval = null;

        }


        if (progresoInterval) {

            clearInterval(
                progresoInterval
            );

            progresoInterval = null;

        }


        /*
           Volvemos a la biblioteca.
        */

        playerModal.style.display =
            "none";


        /*
           Recargar la página limpia
           la instancia del emulador.
        */

        location.reload();

    }
);


/* =========================================================
   INICIO
========================================================= */

mostrarJuegos();

</script>

</body>
</html>
