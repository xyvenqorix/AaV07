<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi Game Boy</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #080a0c;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
}

header {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #11151a;
    border-bottom: 1px solid #292e35;
    font-weight: bold;
}

#player {
    width: 100%;
    flex: 1;
    min-height: 0;
    background: #000;
}

#loading {
    position: fixed;
    inset: 64px 0 0 0;
    background: #080a0c;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 10;
}

#loading h2 {
    margin: 0 0 10px;
}

#loading p {
    color: #999;
    margin: 0;
}

#error {
    display: none;
    color: #ff7070;
    text-align: center;
    max-width: 500px;
    padding: 20px;
}
</style>
</head>

<body>

<header>
    🎮 Mi juego de Game Boy
</header>

<div id="loading">
    <h2>🎮 Cargando juego...</h2>
    <p>Espera un momento</p>

    <div id="error">
        ❌ No se pudo cargar el juego.
        <br><br>
        Comprueba que <b>juego.gb</b> esté en la misma carpeta que
        <b>index.html</b>.
    </div>
</div>

<div id="player"></div>


<script>

/*
    CONFIGURACIÓN
    --------------------------------
    El archivo debe llamarse:

        juego.gb

    y estar junto a index.html.
*/

window.EJS_player = "#player";


// Game Boy ORIGINAL
window.EJS_core = "gb";


// ROM
window.EJS_gameUrl = "./Pokemon - Red Version (UE) [S][!].gb";


// Nombre del juego
window.EJS_gameName = "Mi juego";


// Datos de EmulatorJS
window.EJS_pathtodata =
    "https://cdn.emulatorjs.org/stable/data/";


// Iniciar automáticamente
window.EJS_startOnLoaded = true;


// Controles Game Boy
window.EJS_controlScheme = "gameboy";


// Ocultar pantalla de carga cuando termine
window.EJS_onGameStart = function() {

    const loading = document.getElementById("loading");

    if (loading) {
        loading.style.display = "none";
    }

};


// Cargar EmulatorJS
const script = document.createElement("script");

script.src =
    "https://cdn.emulatorjs.org/stable/data/loader.js";

script.onload = function() {

    console.log("EmulatorJS cargado");

};

script.onerror = function() {

    document.querySelector("#loading p").style.display =
        "none";

    document.querySelector("#error").style.display =
        "block";

};

document.body.appendChild(script);

</script>

</body>
</html>
