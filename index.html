<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Game Boy Web</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#080a0f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    height:60px;
    padding:0 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#10141b;
    border-bottom:1px solid #292e37;
    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    font-size:19px;
    font-weight:800;
}

.subtitle{
    color:#858c97;
    font-size:12px;
}

.container{
    max-width:1250px;
    margin:auto;
    padding:20px 14px 50px;
}

.title{
    margin-bottom:16px;
}

.title h1{
    margin:0;
    font-size:24px;
}

.title p{
    margin:5px 0 0;
    color:#858c97;
    font-size:13px;
}

.search{
    margin-bottom:18px;
}

.search input{
    width:100%;
    padding:12px 15px;
    border-radius:11px;
    border:1px solid #292f38;
    outline:none;
    background:#11151c;
    color:#fff;
    font-size:14px;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
    gap:14px;
}

.game{
    position:relative;
    min-width:0;
    overflow:hidden;
    border:1px solid #292f38;
    border-radius:12px;
    background:#11151c;
    transition:.18s;
}

.game:hover{
    transform:translateY(-3px);
    border-color:#5865f2;
}

.cover{
    width:100%;
    aspect-ratio:1/1.25;
    background:#181c24;
    overflow:hidden;
}

.cover img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.info{
    padding:8px;
}

.game-name{
    margin-bottom:7px;
    text-align:center;
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.play{
    width:100%;
    padding:8px;
    border:0;
    border-radius:8px;
    background:#5865f2;
    color:white;
    font-weight:700;
    font-size:12px;
    cursor:pointer;
}

.favorite{
    position:absolute;
    right:7px;
    top:7px;
    z-index:5;
    width:29px;
    height:29px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.75);
    color:#fff;
    font-size:16px;
}

.favorite.active{
    color:#ffd84d;
}


/* =========================
   EMULADOR
========================= */

#playerModal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    flex-direction:column;
    background:#000;
}

.playerHeader{
    height:58px;
    flex-shrink:0;
    padding:0 7px 0 12px;
    display:flex;
    align-items:center;
    gap:5px;
    background:#10141b;
    border-bottom:1px solid #292e37;
}

.playerTitle{
    flex:1;
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:14px;
    font-weight:700;
}

.headerButton{
    flex-shrink:0;
    border:1px solid #353b46;
    border-radius:8px;
    padding:7px 9px;
    background:#20252e;
    color:#fff;
    font-size:11px;
    cursor:pointer;
}

.headerButton:active{
    transform:scale(.95);
}

.close{
    background:#303640;
}

#player{
    position:relative;
    width:100%;
    height:calc(100vh - 58px);
    overflow:hidden;
    background:#000;
}


/* =========================
   CARGANDO
========================= */

#loading{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#050608;
    text-align:center;
    padding:20px;
}

.loadingIcon{
    font-size:42px;
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.1)}
}

.loadingTitle{
    margin-top:10px;
    font-size:19px;
    font-weight:800;
}

.loadingText{
    margin-top:6px;
    color:#858c97;
    font-size:12px;
}

.progress{
    width:min(350px,85%);
    height:7px;
    margin-top:20px;
    overflow:hidden;
    border-radius:20px;
    background:#20242c;
}

.progressBar{
    width:0;
    height:100%;
    background:#5865f2;
    transition:width .2s;
}

.percent{
    margin-top:8px;
    color:#999;
    font-size:12px;
}

#error{
    display:none;
    max-width:420px;
    margin-top:15px;
    color:#ff7070;
    font-size:13px;
    line-height:1.5;
}


/* =========================
   MENSAJE
========================= */

#toast{
    position:fixed;
    left:50%;
    bottom:25px;
    z-index:500;
    transform:translateX(-50%) translateY(20px);
    opacity:0;
    pointer-events:none;

    padding:10px 14px;

    border-radius:10px;

    background:#171b22;
    border:1px solid #343a45;

    color:#fff;
    font-size:12px;

    transition:.25s;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}


/* =========================
   MÓVIL
========================= */

@media(max-width:600px){

    .container{
        padding:15px 9px 40px;
    }

    .games{
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:9px;
    }

    .game-name{
        font-size:11px;
    }

    .play{
        padding:7px;
        font-size:10px;
    }

    .playerHeader{
        padding-left:7px;
        padding-right:5px;
        gap:4px;
    }

    .playerTitle{
        font-size:12px;
    }

    .headerButton{
        padding:6px 7px;
        font-size:9px;
    }
}

@media(max-width:350px){

    .games{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .headerButton{
        padding:6px 5px;
    }
}
</style>
</head>

<body>


<header>

    <div class="logo">
        🎮 Game Boy Web
    </div>

    <div class="subtitle">
        Biblioteca
    </div>

</header>


<main class="container">

    <div class="title">

        <h1>🎮 Juegos</h1>

        <p>
            Toca JUGAR para comenzar
        </p>

    </div>


    <div class="search">

        <input
            id="search"
            type="search"
            placeholder="🔎 Buscar juego..."
            autocomplete="off">

    </div>


    <div
        id="games"
        class="games">
    </div>

</main>


<!-- =========================
     PLAYER
========================= -->

<div id="playerModal">

    <div class="playerHeader">

        <div
            id="playerTitle"
            class="playerTitle">
            🎮 Juego
        </div>


        <button
            id="exportButton"
            class="headerButton">
            📤 Exportar
        </button>


        <button
            id="importButton"
            class="headerButton">
            📥 Importar
        </button>


        <button
            id="closePlayer"
            class="headerButton close">
            ✕ Cerrar
        </button>


        <input
            id="importFile"
            type="file"
            accept=".state"
            hidden>

    </div>


    <div id="player">

        <div id="loading">

            <div class="loadingIcon">
                🎮
            </div>

            <div class="loadingTitle">
                Cargando juego
            </div>

            <div
                id="loadingText"
                class="loadingText">
                Preparando Game Boy...
            </div>

            <div class="progress">

                <div
                    id="progressBar"
                    class="progressBar">
                </div>

            </div>

            <div
                id="percent"
                class="percent">
                0%
            </div>

            <div id="error">

                ❌ No se pudo cargar el juego.

                <br><br>

                Comprueba que el archivo
                <b>.gb</b>
                exista en tu repositorio.

            </div>

        </div>

    </div>

</div>


<div id="toast"></div>


<script>

/* =========================================================
   JUEGOS

   Pon los archivos .gb junto al index.html.

   Ejemplo:

   index.html
   mario.gb
   pokemon.gb
========================================================= */

const juegos = [

    {
        id: 1,
        name: "Mi Juego 1",
        rom: "juego1.gb",
        cover: "https://i.imgur.com/REEMPLAZA-ESTO.jpg"
    },

    {
        id: 2,
        name: "Mi Juego 2",
        rom: "juego2.gb",
        cover: "https://i.imgur.com/REEMPLAZA-ESTO.jpg"
    }

];


/* =========================================================
   ELEMENTOS
========================================================= */

const games =
    document.getElementById("games");

const search =
    document.getElementById("search");

const playerModal =
    document.getElementById("playerModal");

const playerTitle =
    document.getElementById("playerTitle");

const closePlayer =
    document.getElementById("closePlayer");

const exportButton =
    document.getElementById("exportButton");

const importButton =
    document.getElementById("importButton");

const importFile =
    document.getElementById("importFile");

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const progressBar =
    document.getElementById("progressBar");

const percent =
    document.getElementById("percent");

const error =
    document.getElementById("error");

const toast =
    document.getElementById("toast");


/* =========================================================
   VARIABLES
========================================================= */

let juegoActual = null;

let progresoTimer = null;

let autoSaveTimer = null;


/* =========================================================
   FAVORITOS
========================================================= */

let favoritos =
    JSON.parse(
        localStorage.getItem("gb_favoritos") || "[]"
    );


function guardarFavoritos(){

    localStorage.setItem(
        "gb_favoritos",
        JSON.stringify(favoritos)
    );

}


/* =========================================================
   MENSAJE
========================================================= */

let toastTimer = null;

function mostrarToast(texto){

    toast.textContent = texto;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            ()=>{
                toast.classList.remove("show");
            },
            1800
        );
}


/* =========================================================
   LISTA DE JUEGOS
========================================================= */

function mostrarJuegos(lista=juegos){

    games.innerHTML = "";


    if(!lista.length){

        games.innerHTML = `

            <p style="
                grid-column:1/-1;
                text-align:center;
                color:#858c97;
                padding:30px;">

                No se encontraron juegos.

            </p>

        `;

        return;
    }


    lista.forEach(juego=>{

        const card =
            document.createElement("article");


        card.className =
            "game";


        const favorito =
            favoritos.includes(
                juego.id
            );


        card.innerHTML = `

            <button
                class="favorite ${
                    favorito ? "active" : ""
                }">

                ${favorito ? "★" : "☆"}

            </button>


            <div class="cover">

                <img
                    src="${juego.cover}"
                    alt="${juego.name}"
                    loading="lazy"
                    onerror="
                        this.style.display='none';
                    ">

            </div>


            <div class="info">

                <div class="game-name">
                    ${juego.name}
                </div>


                <button class="play">
                    ▶ JUGAR
                </button>

            </div>

        `;


        const fav =
            card.querySelector(
                ".favorite"
            );


        fav.onclick =
            event=>{

                event.stopPropagation();


                if(
                    favoritos.includes(
                        juego.id
                    )
                ){

                    favoritos =
                        favoritos.filter(
                            id =>
                                id !== juego.id
                        );

                }else{

                    favoritos.push(
                        juego.id
                    );

                }


                guardarFavoritos();


                mostrarJuegos(
                    filtrar(
                        search.value
                    )
                );

            };


        /*
           La imagen NO abre el juego.

           Solamente JUGAR.
        */

        card.querySelector(
            ".play"
        ).onclick =
            event=>{

                event.stopPropagation();

                abrirJuego(juego);

            };


        games.appendChild(card);

    });
}


/* =========================================================
   BUSCAR
========================================================= */

function filtrar(texto){

    texto =
        texto
        .toLowerCase()
        .trim();


    if(!texto){
        return juegos;
    }


    return juegos.filter(
        juego =>
            juego.name
            .toLowerCase()
            .includes(texto)
    );
}


search.addEventListener(
    "input",
    ()=>{
        mostrarJuegos(
            filtrar(search.value)
        );
    }
);


/* =========================================================
   CONFIGURAR EMULATORJS
========================================================= */

function configurarEmulador(juego){

    window.EJS_player =
        "#player";


    window.EJS_core =
        "gb";


    window.EJS_gameUrl =
        juego.rom;


    window.EJS_gameName =
        juego.name;


    /*
       IMPORTANTE:

       EmulatorJS recomienda que EJS_gameID
       sea numérico y único para cada juego.
    */

    window.EJS_gameID =
        juego.id;


    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";


    window.EJS_startOnLoaded =
        true;


    window.EJS_controlScheme =
        "gb";


    /*
       Guardar estados en el navegador
       además de permitir Save State.
    */

    window.EJS_defaultOptions = {

        "save-state-location":
            "browser"

    };


    /*
       =====================================================
       ESTA ES LA PARTE IMPORTANTE
       =====================================================

       EmulatorJS entrega aquí el Save State REAL.

       data.state = estado binario real
       data.screenshot = captura del estado
    */

    window.EJS_onSaveState =
        function(data){

            /*
               Guardamos el último estado real
               en memoria para Exportar.
            */

            window.ultimoSaveState =
                data.state;


            /*
               Si Exportar estaba esperando
               este Save State, descargamos.
            */

            if(
                window.exportandoEstado === true
            ){

                window.exportandoEstado =
                    false;


                descargarSaveState(
                    data.state
                );

            }

        };


    /*
       Cuando EmulatorJS carga un estado.
    */

    window.EJS_onLoadState =
        function(data){

            console.log(
                "Save State cargado"
            );

        };

}


/* =========================================================
   ABRIR JUEGO
========================================================= */

function abrirJuego(juego){

    juegoActual =
        juego;


    playerTitle.textContent =
        "🎮 " + juego.name;


    playerModal.style.display =
        "flex";


    loading.style.display =
        "flex";


    error.style.display =
        "none";


    progressBar.style.width =
        "0%";


    percent.textContent =
        "0%";


    loadingText.textContent =
        "Preparando Game Boy...";


    /*
       Limpiar estado anterior.
    */

    window.ultimoSaveState =
        null;


    window.exportandoEstado =
        false;


    configurarEmulador(
        juego
    );


    let progreso = 0;


    clearInterval(
        progresoTimer
    );


    progresoTimer =
        setInterval(
            ()=>{

                if(
                    progreso < 90
                ){

                    progreso += 4;


                    progressBar.style.width =
                        progreso + "%";


                    percent.textContent =
                        progreso + "%";


                    if(
                        progreso < 30
                    ){

                        loadingText.textContent =
                            "Cargando emulador...";

                    }else if(
                        progreso < 60
                    ){

                        loadingText.textContent =
                            "Preparando controles...";

                    }else{

                        loadingText.textContent =
                            "Cargando juego...";

                    }

                }

            },
            250
        );


    /*
       Eliminar loader anterior.
    */

    const viejo =
        document.getElementById(
            "emulatorLoader"
        );


    if(viejo){

        viejo.remove();

    }


    /*
       Cargar EmulatorJS.
    */

    const script =
        document.createElement(
            "script"
        );


    script.id =
        "emulatorLoader";


    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";


    script.onload =
        ()=>{

            setTimeout(
                ()=>{

                    clearInterval(
                        progresoTimer
                    );


                    progressBar.style.width =
                        "100%";


                    percent.textContent =
                        "100%";


                    loadingText.textContent =
                        "¡Juego listo!";


                    setTimeout(
                        ()=>{

                            loading.style.display =
                                "none";


                            iniciarAutoGuardado();

                        },
                        700
                    );

                },
                1800
            );

        };


    script.onerror =
        ()=>{

            clearInterval(
                progresoTimer
            );


            loadingText.textContent =
                "Error al cargar EmulatorJS.";


            error.style.display =
                "block";

        };


    document.body.appendChild(
        script
    );

}


/* =========================================================
   DESCARGAR SAVE STATE REAL
========================================================= */

function descargarSaveState(state){

    if(!state){

        mostrarToast(
            "❌ No se recibió el estado."
        );

        return;
    }


    try{

        /*
           EmulatorJS entrega el estado
           como buffer/Uint8Array.

           NO lo convertimos a JSON.
        */

        const bytes =
            state instanceof Uint8Array
                ? state
                : new Uint8Array(state);


        const blob =
            new Blob(
                [bytes],
                {
                    type:
                    "application/octet-stream"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const enlace =
            document.createElement(
                "a"
            );


        enlace.href =
            url;


        enlace.download =
            limpiarNombre(
                juegoActual.name
            ) +
            ".state";


        /*
           Esto provoca la descarga REAL
           del archivo en el navegador.

           En Android/Chrome debe aparecer
           la descarga del archivo.
        */

        enlace.style.display =
            "none";


        document.body.appendChild(
            enlace
        );


        enlace.click();


        enlace.remove();


        setTimeout(
            ()=>{
                URL.revokeObjectURL(
                    url
                );
            },
            3000
        );


        mostrarToast(
            "📤 Descargando Save State..."
        );


    }catch(e){

        console.error(
            "Error descargando:",
            e
        );


        mostrarToast(
            "❌ Error al descargar"
        );

    }

}


/* =========================================================
   NOMBRE SEGURO
========================================================= */

function limpiarNombre(nombre){

    return String(nombre)
        .replace(
            /[\\/:*?"<>|]/g,
            "_"
        )
        .trim() ||
        "gameboy-save";

}


/* =========================================================
   EXPORTAR
========================================================= */

exportButton.onclick =
    ()=>{

        if(!juegoActual){

            mostrarToast(
                "No hay ningún juego abierto."
            );

            return;
        }


        const emulador =
            window.EJS_emulator;


        if(
            !emulador ||
            !emulador.gameManager ||
            typeof
            emulador.gameManager.saveState
            !== "function"
        ){

            mostrarToast(
                "Espera a que el juego termine de cargar."
            );

            return;
        }


        /*
           Activamos una bandera.

           El siguiente Save State REAL que
           genere EmulatorJS será exportado.
        */

        window.exportandoEstado =
            true;


        try{

            /*
               Este es el método usado para
               generar el Save State real.
            */

            emulador
                .gameManager
                .saveState();


            mostrarToast(
                "💾 Preparando descarga..."
            );


        }catch(e){

            window.exportandoEstado =
                false;


            console.error(e);


            mostrarToast(
                "❌ No se pudo crear el estado."
            );

        }

    };


/* =========================================================
   IMPORTAR
========================================================= */

importButton.onclick =
    ()=>{

        if(!juegoActual){

            mostrarToast(
                "Primero abre un juego."
            );

            return;
        }


        /*
           Android/Chrome abrirá el selector
           de archivos del teléfono.
        */

        importFile.click();

    };


importFile.addEventListener(
    "change",
    async function(){

        const archivo =
            this.files[0];


        if(!archivo){

            return;

        }


        const emulador =
            window.EJS_emulator;


        if(
            !emulador ||
            !emulador.gameManager ||
            typeof
            emulador.gameManager.loadState
            !== "function"
        ){

            mostrarToast(
                "El emulador todavía no está listo."
            );

            this.value = "";

            return;
        }


        try{

            mostrarToast(
                "📥 Cargando partida..."
            );


            /*
               Leer el .state como bytes.
            */

            const buffer =
                await archivo.arrayBuffer();


            const state =
                new Uint8Array(
                    buffer
                );


            /*
               CARGA DIRECTA SOBRE EL JUEGO
               QUE YA ESTÁ ABIERTO.

               NO reinicia la ROM.
            */

            emulador
                .gameManager
                .loadState(
                    state
                );


            mostrarToast(
                "✅ Partida cargada"
            );


        }catch(e){

            console.error(
                "Error importando Save State:",
                e
            );


            mostrarToast(
                "❌ El archivo no es compatible."
            );

        }


        /*
           Permitir seleccionar nuevamente
           el mismo archivo.
        */

        this.value = "";

    }
);


/* =========================================================
   AUTO-GUARDADO
========================================================= */

function iniciarAutoGuardado(){

    clearInterval(
        autoSaveTimer
    );


    /*
       Cada minuto genera un Save State
       interno de EmulatorJS.

       NO descarga archivos automáticamente.
    */

    autoSaveTimer =
        setInterval(
            ()=>{

                const emulador =
                    window.EJS_emulator;


                if(
                    emulador &&
                    emulador.gameManager &&
                    typeof
                    emulador.gameManager.saveState
                    === "function"
                ){

                    try{

                        emulador
                            .gameManager
                            .saveState();

                    }catch(e){

                        console.log(
                            "Auto-save no disponible."
                        );

                    }

                }

            },
            60000
        );
}


/* =========================================================
   CERRAR
========================================================= */

closePlayer.onclick =
    ()=>{

        clearInterval(
            autoSaveTimer
        );


        clearInterval(
            progresoTimer
        );


        playerModal.style.display =
            "none";


        juegoActual =
            null;


        window.ultimoSaveState =
            null;


        window.exportandoEstado =
            false;


        /*
           Limpiar loader.
        */

        const loader =
            document.getElementById(
                "emulatorLoader"
            );


        if(loader){

            loader.remove();

        }

    };
