<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Boy Web</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080a0f;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    height:60px;
    display:flex;
    align-items:center;
    padding:0 12px;
    background:#11151c;
    border-bottom:1px solid #292e37;
}

.logo{
    font-weight:bold;
    font-size:18px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:18px 12px;
}

.search{
    width:100%;
    padding:12px;
    margin-bottom:16px;
    border-radius:10px;
    border:1px solid #303640;
    background:#11151c;
    color:white;
    outline:none;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
    gap:12px;
}

.game{
    overflow:hidden;
    border:1px solid #292e37;
    border-radius:12px;
    background:#11151c;
}

.cover{
    aspect-ratio:1/1.2;
    background:#191d25;
}

.cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.info{
    padding:8px;
}

.name{
    text-align:center;
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:7px;
}

.play{
    width:100%;
    border:0;
    border-radius:8px;
    padding:8px;
    background:#5865f2;
    color:white;
    font-weight:bold;
}

#playerModal{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    z-index:100;
    flex-direction:column;
}

.playerHeader{
    height:58px;
    display:flex;
    align-items:center;
    gap:5px;
    padding:0 6px 0 10px;
    background:#11151c;
    border-bottom:1px solid #292e37;
}

.playerTitle{
    flex:1;
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:13px;
    font-weight:bold;
}

.btn{
    border:1px solid #353b46;
    border-radius:8px;
    background:#20252e;
    color:white;
    padding:7px 9px;
    font-size:10px;
}

.close{
    background:#303640;
}

#player{
    position:relative;
    width:100%;
    height:calc(100vh - 58px);
    background:#000;
}

#loading{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#050608;
}

.loader{
    font-size:40px;
}

.loadingText{
    margin-top:12px;
    color:#aaa;
    font-size:13px;
}

.progress{
    width:80%;
    max-width:350px;
    height:7px;
    margin-top:18px;
    background:#20242c;
    border-radius:20px;
    overflow:hidden;
}

.progressBar{
    width:0%;
    height:100%;
    background:#5865f2;
}

#percent{
    margin-top:7px;
    font-size:12px;
    color:#999;
}

#toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    padding:10px 15px;
    background:#171b22;
    border:1px solid #343a45;
    border-radius:10px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:500;
}

#toast.show{
    opacity:1;
}

@media(max-width:600px){

    .games{
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:8px;
    }

    .name{
        font-size:10px;
    }

    .play{
        padding:7px;
        font-size:10px;
    }

    .playerHeader{
        gap:3px;
    }

    .btn{
        padding:6px;
        font-size:9px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🎮 Game Boy Web</div>
</header>

<div class="container">

    <input
        id="search"
        class="search"
        placeholder="🔎 Buscar juego...">

    <div
        id="games"
        class="games">
    </div>

</div>


<!-- =========================
     EMULADOR
========================= -->

<div id="playerModal">

    <div class="playerHeader">

        <div
            id="playerTitle"
            class="playerTitle">
            🎮 Juego
        </div>

        <button
            id="exportBtn"
            class="btn">
            📤 Exportar
        </button>

        <button
            id="importBtn"
            class="btn">
            📥 Importar
        </button>

        <button
            id="closeBtn"
            class="btn close">
            ✕ Cerrar
        </button>

        <input
            id="fileInput"
            type="file"
            accept=".json,application/json"
            hidden>

    </div>

    <div id="player">

        <div id="loading">

            <div class="loader">🎮</div>

            <div
                id="loadingText"
                class="loadingText">
                Cargando juego...
            </div>

            <div class="progress">

                <div
                    id="progressBar"
                    class="progressBar">
                </div>

            </div>

            <div id="percent">
                0%
            </div>

        </div>

    </div>

</div>


<div id="toast"></div>


<script>

/* =========================================================
   JUEGOS

   Ponlos junto al index.html:

   index.html
   juego1.gb
   juego2.gb
========================================================= */

const juegos = [

    {
        id:"juego1",
        name:"pokeee",
        rom:"Pokemon - Red Version (UE) [S][!].gb",
        cover:"https://i.imgur.com/REEMPLAZA-IMAGEN.jpg"
    },

    {
        id:"juego2",
        name:"Mi Juego 2",
        rom:"juego2.gb",
        cover:"https://i.imgur.com/REEMPLAZA-IMAGEN.jpg"
    }

];


/* =========================================================
   VARIABLES
========================================================= */

let juegoActual = null;
let loaderTimer = null;


/* =========================================================
   ELEMENTOS
========================================================= */

const games =
    document.getElementById("games");

const search =
    document.getElementById("search");

const modal =
    document.getElementById("playerModal");

const title =
    document.getElementById("playerTitle");

const player =
    document.getElementById("player");

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const progressBar =
    document.getElementById("progressBar");

const percent =
    document.getElementById("percent");

const exportBtn =
    document.getElementById("exportBtn");

const importBtn =
    document.getElementById("importBtn");

const fileInput =
    document.getElementById("fileInput");

const closeBtn =
    document.getElementById("closeBtn");

const toast =
    document.getElementById("toast");


/* =========================================================
   MENSAJE
========================================================= */

let toastTimer;

function msg(text){

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            ()=>{
                toast.classList.remove("show");
            },
            2200
        );
}


/* =========================================================
   LISTA
========================================================= */

function mostrarJuegos(lista=juegos){

    games.innerHTML="";

    lista.forEach(juego=>{

        const card =
            document.createElement("div");

        card.className="game";

        card.innerHTML=`

            <div class="cover">

                <img
                    src="${juego.cover}"
                    alt="${juego.name}"
                    onerror="
                        this.style.display='none'
                    ">

            </div>

            <div class="info">

                <div class="name">
                    ${juego.name}
                </div>

                <button class="play">
                    ▶ JUGAR
                </button>

            </div>
        `;


        card
        .querySelector(".play")
        .onclick=()=>{

            abrirJuego(juego);

        };


        games.appendChild(card);

    });
}


/* =========================================================
   BUSCADOR
========================================================= */

search.oninput=()=>{

    const texto =
        search.value
        .toLowerCase()
        .trim();

    mostrarJuegos(
        juegos.filter(
            juego =>
                juego.name
                .toLowerCase()
                .includes(texto)
        )
    );
};


/* =========================================================
   CONFIGURAR EMULATORJS
========================================================= */

function configurar(juego){

    window.EJS_player =
        "#player";

    window.EJS_core =
        "gb";

    window.EJS_gameUrl =
        juego.rom;

    window.EJS_gameName =
        juego.name;

    window.EJS_gameID =
        juego.id;

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded =
        true;

    window.EJS_controlScheme =
        "gameboy";


    /*
       Este callback recibe el estado
       generado por EmulatorJS.

       Lo guardamos para poder exportarlo.
    */

    window.EJS_onSaveState =
        function(data){

            if(
                data &&
                data.state
            ){

                window.estadoActual =
                    data.state;

                console.log(
                    "Save State recibido."
                );

            }

        };
}


/* =========================================================
   ABRIR JUEGO
========================================================= */

function abrirJuego(juego){

    juegoActual =
        juego;

    title.textContent =
        "🎮 " + juego.name;

    modal.style.display =
        "flex";

    loading.style.display =
        "flex";

    progressBar.style.width =
        "0%";

    percent.textContent =
        "0%";

    loadingText.textContent =
        "Preparando Game Boy...";


    window.estadoActual =
        null;


    configurar(juego);


    clearInterval(loaderTimer);


    let p=0;

    loaderTimer =
        setInterval(()=>{

            if(p<90){

                p+=3;

                progressBar.style.width =
                    p+"%";

                percent.textContent =
                    p+"%";


                if(p<30){

                    loadingText.textContent =
                        "Cargando emulador...";

                }else if(p<60){

                    loadingText.textContent =
                        "Preparando controles...";

                }else{

                    loadingText.textContent =
                        "Cargando juego...";

                }

            }

        },250);


    const viejo =
        document.getElementById(
            "emulatorLoader"
        );

    if(viejo)
        viejo.remove();


    const script =
        document.createElement("script");

    script.id =
        "emulatorLoader";

    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";


    script.onload=()=>{

        setTimeout(()=>{

            clearInterval(loaderTimer);

            progressBar.style.width =
                "100%";

            percent.textContent =
                "100%";

            loadingText.textContent =
                "¡Listo!";


            setTimeout(()=>{

                loading.style.display =
                    "none";

            },600);

        },1500);

    };


    script.onerror=()=>{

        clearInterval(loaderTimer);

        loadingText.textContent =
            "❌ Error cargando EmulatorJS.";

    };


    document.body.appendChild(script);

}


/* =========================================================
   CONVERTIR BYTES A BASE64
========================================================= */

function bytesToBase64(data){

    let bytes;


    if(
        data instanceof Uint8Array
    ){

        bytes=data;

    }else if(
        data instanceof ArrayBuffer
    ){

        bytes =
            new Uint8Array(data);

    }else if(
        ArrayBuffer.isView(data)
    ){

        bytes =
            new Uint8Array(
                data.buffer,
                data.byteOffset,
                data.byteLength
            );

    }else{

        throw new Error(
            "Formato de estado desconocido"
        );

    }


    let binary="";

    const bloque=0x8000;

    for(
        let i=0;
        i<bytes.length;
        i+=bloque
    ){

        binary +=
            String.fromCharCode(
                ...bytes.subarray(
                    i,
                    Math.min(
                        i+bloque,
                        bytes.length
                    )
                )
            );

    }


    return btoa(binary);
}


/* =========================================================
   BASE64 A BYTES
========================================================= */

function base64ToBytes(base64){

    const binary =
        atob(base64);

    const bytes =
        new Uint8Array(
            binary.length
        );


    for(
        let i=0;
        i<binary.length;
        i++
    ){

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;
}


/* =========================================================
   EXPORTAR save.json
========================================================= */

async function exportar(){

    if(!juegoActual){

        msg(
            "Primero abre un juego."
        );

        return;

    }


    const emu =
        window.EJS_emulator;


    if(
        !emu ||
        !emu.gameManager ||
        typeof
        emu.gameManager.saveState
        !== "function"
    ){

        msg(
            "El juego todavía está cargando."
        );

        return;

    }


    msg(
        "💾 Guardando partida..."
    );


    try{

        /*
           Pedimos el Save State REAL.
        */

        let resultado =
            emu.gameManager.saveState();


        /*
           Algunas versiones pueden devolver
           una Promise.
        */

        if(
            resultado &&
            typeof resultado.then ===
            "function"
        ){

            resultado =
                await resultado;

        }


        /*
           Si la versión devuelve directamente
           los bytes, usamos eso.
        */

        let estado =
            resultado;


        /*
           Si no devuelve nada directamente,
           usamos el estado recibido por
           EJS_onSaveState.
        */

        if(!estado){

            estado =
                window.estadoActual;

        }


        /*
           Si sigue sin existir, mostramos
           el error real en lugar de dejar
           "esperando".
        */

        if(!estado){

            msg(
                "⚠️ EmulatorJS no entregó el estado."
            );

            console.error(
                "saveState no devolvió datos."
            );

            return;

        }


        const base64 =
            bytesToBase64(
                estado
            );


        /*
           ESTE SÍ ES UN JSON REAL.
        */

        const save = {

            format:
                "EmulatorJS Save State",

            version:
                1,

            game:
                juegoActual.name,

            gameId:
                juegoActual.id,

            rom:
                juegoActual.rom,

            core:
                "gb",

            created:
                new Date().toISOString(),

            state:
                base64

        };


        const texto =
            JSON.stringify(
                save,
                null,
                2
            );


        const blob =
            new Blob(
                [texto],
                {
                    type:
                    "application/json"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement("a");


        a.href =
            url;


        /*
           NOMBRE EXACTO:
        */

        a.download =
            "save.json";


        a.style.display =
            "none";


        document.body.appendChild(a);


        /*
           DESCARGA DIRECTA.
        */

        a.click();


        a.remove();


        setTimeout(
            ()=>{
                URL.revokeObjectURL(url);
            },
            5000
        );


        msg(
            "📥 save.json descargado"
        );


    }catch(error){

        console.error(
            error
        );

        msg(
            "❌ Error al guardar."
        );

    }

}


/* =========================================================
   BOTÓN EXPORTAR
========================================================= */

exportBtn.onclick =
    exportar;


/* =========================================================
   IMPORTAR save.json
========================================================= */

importBtn.onclick=()=>{

    if(!juegoActual){

        msg(
            "Primero abre un juego."
        );

        return;

    }


    /*
       Abre el selector de archivos
       de Android.
    */

    fileInput.click();

};


fileInput.onchange =
    async function(){

        const archivo =
            this.files[0];


        if(!archivo)
            return;


        try{

            msg(
                "📂 Leyendo save.json..."
            );


            const texto =
                await archivo.text();


            const save =
                JSON.parse(texto);


            /*
               Comprobar que sea nuestro
               formato.
            */

            if(
                !save.state
            ){

                throw new Error(
                    "El archivo no contiene state."
                );

            }


            /*
               Comprobar juego.
            */

            if(
                save.gameId &&
                String(save.gameId)
                !== String(juegoActual.id)
            ){

                const continuar =
                    confirm(
                        "Este save pertenece a otro juego. ¿Intentar cargarlo?"
                    );


                if(!continuar){

                    this.value="";
                    return;

                }

            }


            const bytes =
                base64ToBytes(
                    save.state
                );


            const emu =
                window.EJS_emulator;


            if(
                !emu ||
                !emu.gameManager ||
                typeof
                emu.gameManager.loadState
                !== "function"
            ){

                throw new Error(
                    "Emulador no disponible."
                );

            }


            /*
               CARGAR SOBRE EL JUEGO
               ACTUAL.

               No cerramos.
               No reiniciamos.
            */

            emu.gameManager.loadState(
                bytes
            );


            msg(
                "✅ save.json cargado"
            );


        }catch(error){

            console.error(
                error
            );

            msg(
                "❌ No se pudo cargar save.json"
            );

        }


        /*
           Permite volver a seleccionar
           el mismo archivo.
        */

        this.value="";

    };


/* =========================================================
   CERRAR
========================================================= */

closeBtn.onclick=()=>{

    clearInterval(
        loaderTimer
    );


    modal.style.display =
        "none";


    juegoActual =
        null;


    window.estadoActual =
        null;

};


/* =========================================================
   INICIO
========================================================= */

mostrarJuegos();

</script>

</body>
</html>
